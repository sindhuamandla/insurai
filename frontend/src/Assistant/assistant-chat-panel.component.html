<div class="card">
  <div class="header">
    <div class="kicker">AI Assistant</div>
    <h2 class="title">How can InsurAI help today?</h2>
  </div>

  <div class="messages-area" #chatContainer>
    <div *ngFor="let m of messages" class="message-row"
      [ngClass]="{'message-row-right': m.sender === 'user', 'message-row-left': m.sender === 'assistant'}">

      <div class="bubble" [ngClass]="{'bubble-user': m.sender === 'user', 'bubble-bot': m.sender === 'assistant'}">
        <div>{{ m.text }}</div>
        <div class="meta">
          {{ m.sender === 'user' ? "You" : "InsurAI Assistant" }} · {{ m.time }}
        </div>
      </div>
    </div>

    <div *ngIf="isTyping" class="message-row message-row-left">
      <div class="bubble bubble-bot">
        <div class="typing-dots">
          <span class="dot" style="animation-delay: 0ms"></span>
          <span class="dot" style="animation-delay: 150ms"></span>
          <span class="dot" style="animation-delay: 300ms"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-area">
    <button class="action-btn" (click)="viewPlans.emit()" type="button">
      ✨ View Available Plans
    </button>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea class="input" rows="1" placeholder="Type your question here…" [(ngModel)]="input"
        (keydown)="handleKeyDown($event)"></textarea>
      <button type="button" class="mic-btn" [class.mic-active]="isListening" title="Speak your question"
        (click)="handleMicClick()">
        🎙
      </button>
    </div>
    <button type="button" class="send-btn" (click)="handleSend()" title="Send message">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
