<div class="page-root">
  <div class="center-shell">
    <div class="glow-circle"></div>

    <div class="card">
      <h1 class="title">Sign In</h1>
      <p class="subtitle">
        Don’t have an account yet?
        <button type="button" (click)="onRegisterClick()" class="link-button">
          Sign up
        </button>
      </p>

      <div *ngIf="error" class="error">{{ error }}</div>

      <form (ngSubmit)="handleSubmit()" class="form">
        <label class="label">
          <span class="label-text">Email</span>
          <input type="email" class="input" [(ngModel)]="email" name="email" required autocomplete="email" />
        </label>

        <label class="label">
          <span class="label-text">Password</span>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" class="input password-input" [(ngModel)]="password"
              name="password" required autocomplete="current-password" />
            <button type="button" (click)="togglePassword()" class="eye-button"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </label>

        <button type="submit" [disabled]="loading" class="primary-button">
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
